version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gift-economy-db
    environment:
      POSTGRES_USER: gifteconomy
      POSTGRES_PASSWORD: gifteconomy_dev
      POSTGRES_DB: gift_economy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gifteconomy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
